<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Metehan, Alp Arslan ve II. Kılıçarslan'ın gerçek taktikleriyle kısa savaşlar ve kaynaklı tarih notları. Tarayıcıda ve telefonda oynanan 3D taktik oyunu." />
    <meta name="theme-color" content="#22070a" />
    <!-- Paylaşım önizlemesi. Tarayıcılar göreli adres kabul etmez: alan adı değişirse og:url ve og:image da değişmeli. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HİLAL" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:url" content="https://turkish-heroes.vercel.app/" />
    <meta property="og:title" content="HİLAL — Türk komutanlarının taktik oyunu" />
    <meta property="og:description" content="Metehan, Alp Arslan ve II. Kılıçarslan'ın gerçek taktikleriyle kısa savaşlar ve kaynaklı tarih notları. Kurulumsuz, tarayıcıda ve telefonda." />
    <meta property="og:image" content="https://turkish-heroes.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HİLAL: Türk komutanlarının taktik oyunu — Metehan, Alp Arslan, II. Kılıçarslan" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HİLAL" />
    <title>HİLAL</title>
    <!--
      Anında açılış: JS gelene dek boş ekran yerine giriş ekranının kâğıdı ve
      kömürle bir hilal. Giriş ekranı aynı kâğıtla başlar; App ilk çizimden
      sonra bunu söndürür. Yazı tipi henüz yok, yazı sistem serifiyle.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #c9bfae;
        color: #15110e;
        pointer-events: none;
        transition: opacity 0.5s ease-out;
      }
      #splash.is-gone {
        opacity: 0;
      }
      #splash svg {
        width: 56px;
        height: 56px;
        fill: currentColor;
        opacity: 0.85;
        animation: splash-breathe 1.8s ease-in-out infinite alternate;
      }
      #splash span {
        font: 600 clamp(22px, 5vw, 34px) / 1 Georgia, 'Times New Roman', serif;
        letter-spacing: 0.4em;
        margin-right: -0.4em;
        opacity: 0.7;
      }
      @keyframes splash-breathe {
        from {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="117 1 12 12"><path d="M123 2.2a5 5 0 1 0 0 9.6a6 6 0 0 1 0-9.6z" /></svg>
      <span>HİLAL</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
